name: Update FMG DCF
on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh valuation and alert
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MSN_FMG_FCF_URL: ${{ secrets.MSN_FMG_FCF_URL }}
        run: python update.py
      - name: Commit refreshed data
        run: |
          git config user.name "FMG DCF Bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh FMG valuation"
          git push
